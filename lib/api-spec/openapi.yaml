components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: "Send the key in the x-api-key header."
    BearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: BERAHOST API key
      description: "Send the same key as Authorization: Bearer bh_<key>."
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        coins:
          type: integer
        isVerified:
          type: boolean
        isBanned:
          type: boolean
        isAdmin:
          type: boolean
        referralCode:
          type: ["string", "null"]
        subscriptionPlan:
          type: string
        subscriptionExpiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - email
        - coins
        - isVerified
        - isBanned
        - isAdmin
        - subscriptionPlan
        - createdAt

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message

    RegisterBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        phone:
          type: ["string", "null"]
        referralCode:
          type: ["string", "null"]
      required:
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    UpdateProfileBody:
      type: object
      properties:
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword

    Bot:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        repoUrl:
          type: string
        description:
          type: ["string", "null"]
        platform:
          type: string
        isFeatured:
          type: boolean
        requiredVars:
          type: ["object", "null"]
        optionalVars:
          type: ["object", "null"]
        sessionGuideUrl:
          type: ["string", "null"]
        systemDeps:
          type: ["array", "null"]
          items:
            type: string
        startCommand:
          type: ["string", "null"]
        version:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - repoUrl
        - platform
        - isFeatured
        - version
        - createdAt

    CreateBotBody:
      type: object
      properties:
        name:
          type: string
        repoUrl:
          type: string
        description:
          type: ["string", "null"]
        platform:
          type: string
        isFeatured:
          type: boolean
        requiredVars:
          type: ["object", "null"]
        optionalVars:
          type: ["object", "null"]
        sessionGuideUrl:
          type: ["string", "null"]
        systemDeps:
          type: ["array", "null"]
          items:
            type: string
        startCommand:
          type: ["string", "null"]
      required:
        - name
        - repoUrl
        - platform

    Deployment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        botId:
          type: integer
        containerId:
          type: ["string", "null"]
        pid:
          type: ["integer", "null"]
        envVars:
          type: ["object", "null"]
        sessionIdLocked:
          type: boolean
        status:
          type: string
        platform:
          type: ["string", "null"]
        customName:
          type: ["string", "null"]
        lastActive:
          type: ["string", "null"]
        storageUsedMb:
          type: integer
        storageLimitMb:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]
        bot:
          $ref: "#/components/schemas/Bot"
      required:
        - id
        - userId
        - botId
        - sessionIdLocked
        - status
        - storageUsedMb
        - storageLimitMb
        - createdAt
        - bot

    AdminDeployment:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        botId:
          type: integer
        containerId:
          type: ["string", "null"]
        pid:
          type: ["integer", "null"]
        status:
          type: string
        platform:
          type: ["string", "null"]
        storageUsedMb:
          type: integer
        createdAt:
          type: string
        user:
          type: object
          properties:
            email:
              type: string
          required:
            - email
        bot:
          type: object
          properties:
            name:
              type: string
          required:
            - name
      required:
        - id
        - userId
        - botId
        - status
        - storageUsedMb
        - createdAt
        - user
        - bot

    CreateDeploymentBody:
      type: object
      properties:
        botId:
          type: integer
        envVars:
          type: object
        customName:
          type: ["string", "null"]
      required:
        - botId
        - envVars

    UpdateEnvBody:
      type: object
      properties:
        envVars:
          type: object
      required:
        - envVars

    BotLog:
      type: object
      properties:
        id:
          type: integer
        deploymentId:
          type: integer
        logLine:
          type: string
        logType:
          type: string
        createdAt:
          type: string
      required:
        - id
        - deploymentId
        - logLine
        - logType
        - createdAt

    CoinBalance:
      type: object
      properties:
        coins:
          type: integer
        streak:
          type: integer
        canClaimToday:
          type: boolean
      required:
        - coins
        - streak
        - canClaimToday

    CoinTransaction:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: integer
        type:
          type: string
        reference:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - userId
        - amount
        - type
        - createdAt

    RedeemVoucherBody:
      type: object
      properties:
        code:
          type: string
      required:
        - code

    RedeemResponse:
      type: object
      properties:
        message:
          type: string
        coinsAwarded:
          type: integer
        newBalance:
          type: integer
      required:
        - message
        - coinsAwarded
        - newBalance

    DailyClaimResponse:
      type: object
      properties:
        message:
          type: string
        coinsAwarded:
          type: integer
        streakDays:
          type: integer
        newBalance:
          type: integer
      required:
        - message
        - coinsAwarded
        - streakDays
        - newBalance

    InitiatePaymentBody:
      type: object
      properties:
        phone:
          type: string
        package:
          type: string
      required:
        - phone
        - package

    PaymentResponse:
      type: object
      properties:
        message:
          type: string
        transactionId:
          type: integer
        package:
          type: string
        amountKes:
          type: integer
        coinsToAward:
          type: integer
