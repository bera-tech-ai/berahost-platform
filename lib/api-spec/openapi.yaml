openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BERAHOST API specification. Customer API-key access is only available for explicitly marked customer-owned endpoints; authentication, admin, callback, session and excluded legacy operations are not accessible with API keys.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: bots
    description: Bot marketplace
  - name: deployments
    description: Bot deployments
  - name: coins
    description: Coin economy
  - name: payments
    description: PayHero payments
  - name: subscriptions
    description: Subscription plans
  - name: admin
    description: Admin operations
  - name: support
    description: Support tickets
  - name: apikeys
    description: API key management
  - name: customer-api
    description: Customer-owned operations available to API keys
  - name: notifications
    description: Notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      x-api-key-accessible: false
      x-api-key-access: Public; API key not required
      security: []
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [auth]
      summary: Register new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    put:
      operationId: updateProfile
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [auth]
      summary: Update display name, avatar, and phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # BOTS
  /bots:
    get:
      operationId: listBots
      x-api-key-accessible: false
      x-api-key-access: Public; API key not required
      security: []
      tags: [bots]
      summary: List all available bots
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bot"

  /bots/{id}:
    get:
      operationId: getBot
      x-api-key-accessible: false
      x-api-key-access: Public; API key not required
      security: []
      tags: [bots]
      summary: Get bot details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # DEPLOYMENTS
  /deployments:
    get:
      operationId: listDeployments
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: List user's deployments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
    post:
      operationId: createDeployment
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Deploy new bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deployments/{id}:
    get:
      operationId: getDeployment
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Get deployment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDeployment
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Delete deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /deployments/{id}/start:
    post:
      operationId: startDeployment
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Start stopped bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"

  /deployments/{id}/stop:
    post:
      operationId: stopDeployment
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Stop running bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"

  /deployments/{id}/env:
    put:
      operationId: updateDeploymentEnv
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Update deployment env vars (SESSION_ID locked)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deployments/{id}/logs:
    get:
      operationId: getDeploymentLogs
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [deployments]
      summary: Get recent deployment logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotLog"

  # COINS
  /coins/balance:
    get:
      operationId: getCoinBalance
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [coins]
      summary: Get user coin balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinBalance"

  /coins/transactions:
    get:
      operationId: listCoinTransactions
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [coins]
      summary: List coin transaction history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinTransaction"

  /coins/redeem:
    post:
      operationId: redeemVoucher
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [coins]
      summary: Redeem gift code or voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemVoucherBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coins/daily-claim:
    post:
      operationId: claimDailyBonus
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [coins]
      summary: Claim daily bonus coins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyClaimResponse"
        "400":
          description: Already claimed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # PAYMENTS
  /payments/initiate:
    post:
      operationId: initiatePayment
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [payments]
      summary: Initiate STK push payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/callback:
    post:
      operationId: paymentCallback
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [payments]
      summary: PayHero webhook callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /payments/history:
    get:
      operationId: listPayments
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [payments]
      summary: List payment history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentTransaction"

  # SUBSCRIPTIONS
  /subscriptions/plans:
    get:
      operationId: listSubscriptionPlans
      x-api-key-accessible: false
      x-api-key-access: Public; API key not required
      security: []
      tags: [subscriptions]
      summary: List available subscription plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscriptions/status:
    get:
      operationId: getSubscriptionStatus
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [subscriptions]
      summary: Get current subscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"

  /subscriptions/subscribe:
    post:
      operationId: subscribeToPlan
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [subscriptions]
      summary: Subscribe to plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [notifications]
      summary: List user notifications
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # SUPPORT
  /support/tickets:
    get:
      operationId: listSupportTickets
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [support]
      summary: List user's support tickets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [support]
      summary: Create support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

  /support/tickets/{id}/messages:
    get:
      operationId: getTicketMessages
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [support]
      summary: Get ticket conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketMessage"
    post:
      operationId: replyToTicket
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [support]
      summary: Reply to ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketReplyBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"

  # API KEYS
  /api-keys:
    get:
      operationId: listApiKeys
      x-api-key-accessible: true
      x-api-key-scope: read
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [apikeys]
      summary: List API keys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [apikeys]
      summary: Generate API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"

  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      x-api-key-accessible: true
      x-api-key-scope: write
      security:
        - ApiKey: []
        - BearerApiKey: []
      tags: [apikeys]
      summary: Revoke API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ADMIN
  /admin/stats:
    get:
      operationId: getAdminStats
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/revenue-chart:
    get:
      operationId: getRevenueChart
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: Get revenue chart data (last 30 days)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueDataPoint"

  /admin/users:
    get:
      operationId: adminListUsers
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: List all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}/ban:
    post:
      operationId: adminBanUser
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: Ban or unban user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUserBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/users/{id}/coins:
    post:
      operationId: adminAdjustCoins
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: Adjust user coin balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCoinsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/deployments:
    get:
      operationId: adminListDeployments
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: List all deployments across all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDeployment"

  /admin/deployments/{id}/stop:
    post:
      operationId: adminStopDeployment
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: Force stop any deployment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/bots:
    get:
      operationId: adminListBots
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: List all bot templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bot"
    post:
      operationId: adminCreateBot
      x-api-key-accessible: false
      x-api-key-access: Not available using customer API keys
      security: []
      tags: [admin]
      summary: Create bot template
      requestBody:
        required: true
        content:
          application/json:
